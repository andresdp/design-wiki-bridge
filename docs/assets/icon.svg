<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t d">
  <title id="t">design-wiki-bridge</title>
  <desc id="d">A bridge arc connecting a wiki page on the left to a code block on the right, with a citation pin on the bridge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0f1f33"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Wiki page (left) -->
  <g transform="translate(28 74)">
    <path d="M0 8a8 8 0 0 1 8-8h44l20 20v80a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="#f4f1ea"/>
    <path d="M52 0v14a6 6 0 0 0 6 6h14z" fill="#d6cfbf"/>
    <rect x="12" y="32" width="44" height="7" rx="3.5" fill="#1e3a5f"/>
    <rect x="12" y="48" width="48" height="5" rx="2.5" fill="#8a94a3"/>
    <rect x="12" y="60" width="40" height="5" rx="2.5" fill="#8a94a3"/>
    <rect x="12" y="72" width="46" height="5" rx="2.5" fill="#8a94a3"/>
    <rect x="12" y="84" width="30" height="5" rx="2.5" fill="#8a94a3"/>
  </g>

  <!-- Code block (right) -->
  <g transform="translate(156 74)">
    <rect width="72" height="108" rx="8" fill="#2b4c74"/>
    <path d="M24 38 12 54l12 16" fill="none" stroke="#7fd1b9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 38l12 16-12 16" fill="none" stroke="#7fd1b9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 34 32 74" stroke="#7fd1b9" stroke-width="6" stroke-linecap="round"/>
    <rect x="12" y="86" width="48" height="5" rx="2.5" fill="#5f7fa6"/>
  </g>

  <!-- Bridge -->
  <path d="M84 150 Q128 92 172 150" fill="none" stroke="#f2b544" stroke-width="9" stroke-linecap="round"/>
  <path d="M84 162 H172" stroke="#f2b544" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#f2b544" stroke-width="4" stroke-linecap="round">
    <path d="M106 130v32"/>
    <path d="M128 121v41"/>
    <path d="M150 130v32"/>
  </g>

  <!-- Citation pin -->
  <circle cx="128" cy="64" r="18" fill="#f2b544"/>
  <text x="128" y="69" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#0f1f33">[1]</text>
  <path d="M128 80v38" stroke="#f2b544" stroke-width="3" stroke-dasharray="4 4"/>
</svg>
