<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t d">
  <title id="t">design-wiki-bridge</title>
  <desc id="d">A bridge connecting a wiki page on the left to a UML class diagram on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0f1f33"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Wiki page (left) -->
  <g transform="translate(24 74)">
    <path d="M0 8a8 8 0 0 1 8-8h44l20 20v80a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="#f4f1ea"/>
    <path d="M52 0v14a6 6 0 0 0 6 6h14z" fill="#d6cfbf"/>
    <rect x="12" y="32" width="44" height="7" rx="3.5" fill="#1e3a5f"/>
    <rect x="12" y="48" width="48" height="5" rx="2.5" fill="#8a94a3"/>
    <rect x="12" y="60" width="40" height="5" rx="2.5" fill="#8a94a3"/>
    <rect x="12" y="72" width="46" height="5" rx="2.5" fill="#8a94a3"/>
    <rect x="12" y="84" width="30" height="5" rx="2.5" fill="#8a94a3"/>
  </g>

  <!-- UML class diagram (right) -->
  <g fill="#2b4c74" stroke="#7fd1b9" stroke-width="3.5">
    <!-- Parent class -->
    <rect x="170" y="42" width="52" height="46" rx="4"/>
    <!-- Two subclasses -->
    <rect x="150" y="160" width="40" height="38" rx="4"/>
    <rect x="198" y="160" width="40" height="38" rx="4"/>
  </g>
  <g stroke="#7fd1b9" stroke-width="3">
    <!-- Compartment dividers -->
    <path d="M170 58h52M170 73h52"/>
    <path d="M150 173h40M198 173h40"/>
  </g>
  <!-- Generalization (inheritance) arrows -->
  <g fill="none" stroke="#7fd1b9" stroke-width="3.5" stroke-linejoin="round">
    <path d="M170 160v-26h48v26"/>
    <path d="M196 134v-31"/>
    <path d="M186 103l10-15 10 15z" fill="#2b4c74"/>
  </g>

  <!-- Bridge -->
  <path d="M96 150 Q124 104 152 150" fill="none" stroke="#f2b544" stroke-width="8" stroke-linecap="round"/>
  <path d="M90 160 H158" stroke="#f2b544" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#f2b544" stroke-width="4" stroke-linecap="round">
    <path d="M110 134v26"/>
    <path d="M124 127v33"/>
    <path d="M138 134v26"/>
  </g>
</svg>
