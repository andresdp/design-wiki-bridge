# Example run manifest, condition A (Flask). Placeholder IDs and models must be replaced
# before the pilot; KTD14 budgets are the proposed defaults, frozen after the U11 pilot.
run_id: flask-A-dev-001
condition: A
repo: flask
repo_sha: 2c1b30d0503cfb064f1cb252e6614a06915a362a
checkout: artifacts/checkouts/flask-3.1.2
question_set:
  id: flask-dev
  path: data/questions/dev/flask.jsonl
  hash: null
indexes:
  code_index_id: code-flask-4389daaac0e9   # text-embedding-3-large, 1358 chunks
  pdf_index_id: pdf-flask-v1-55138d10d333   # rfc9110 + rfc3875, 226 pages
pdf_enabled: true
models:
  generator: gpt-5.6-luna   # KTD10: same model as the wiki generator and the reranker
  reranker: gpt-5.6-luna    # same pinned model as the generator
  embedding: text-embedding-3-large
  temperature: 0.0
prompts:
  generate:
    path: src/dwb/prompt_files/generate_v2.md
budgets:
  code_top_k: 40            # = rerank_pool, so code-only items can fill the token budget too
  wiki_search_k: 10
  wiki_read_sections: 5
  wiki_max_spans: 20
  max_span_tokens: 1500
  pdf_top_k: 10
  rerank_pool: 40
  rerank_top_n: 40          # = rerank_pool: the token budget, not a count, sizes the context
  context_tokens: 8000
web:
  enabled: true
  mode: replay
  store_id: tavily-flask-v2   # v2: captured with exclude_domains (v1 predates it)
  max_results: 5
  search_depth: basic
  exclude_domains:           # the project's own docs and source hosts (spike doc §8)
    - flask.palletsprojects.com
    - github.com
    - pypi.org
