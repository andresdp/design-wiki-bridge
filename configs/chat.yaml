# Defaults for `dwb ask` / `dwb chat` (interactive use; experiments use configs/manifests/).
# Every value can be overridden on the command line.
models:
  generator: gpt-5.6-luna
  reranker: gpt-5.6-luna
  embedding: text-embedding-3-large   # must match the model the indexes were built with
  temperature: 0.0

prompt: src/dwb/prompt_files/generate_v1.md

# Default source toggles. The repository itself is always on.
sources:
  wiki: false    # true: repository evidence found through the OpenWiki snapshot (like condition B)
  pdf: true      # used only when a PDF index exists for the repository's corpus
  web: false     # live Tavily searches, cached under artifacts/tavily/chat-<repo>/

web:
  max_results: 5
  search_depth: basic

# Per-repository settings. Repositories themselves (URL, SHA, checkout) are in configs/repos.yaml.
repos:
  flask:
    pdf_corpus: configs/pdfs/flask.yaml
    web_exclude_domains: [flask.palletsprojects.com, github.com, pypi.org]
  requests:
    pdf_corpus: configs/pdfs/requests.yaml
    web_exclude_domains: [requests.readthedocs.io, docs.python-requests.org, github.com, pypi.org]
