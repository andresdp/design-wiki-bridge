# Offline evaluation config (U12). The judge is pinned separately from the generator (KTD10, KTD16).
judge:
  model: gpt-5.4-mini-2026-03-17  # dated snapshot; differs from the generator (gpt-5.6-luna); KTD-B14
  temperature: 0.0
  prompts_dir: src/dwb/prompt_files   # judge_claim_v1.md, judge_support_v1.md
  cache: artifacts/judge_cache.jsonl
matching:                    # KTD15
  min_overlap_lines: 1
  jaccard_threshold: 0.5     # sensitivity variant
  web_passage_overlap: 0.5
deepeval:
  enabled: false             # diagnostics only: contextual recall, faithfulness
  model: gpt-5.4-mini-2026-03-17   # dated mini snapshot: diagnostics only (KTD-B13)
  price_per_million: {input: 0.75, output: 4.50}   # USD; DeepEval's table lists only gpt-5.4-mini
  cache: artifacts/deepeval_cache.jsonl   # reuse rows across pairwise reports (A/B, A/C, B/C)
